name: ci-cd

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/vitalsync-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vitalsync/backend/package-lock.json

      - name: Install dependencies
        working-directory: vitalsync/backend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: vitalsync/backend
        run: npm run lint

      - name: Tests (Jest)
        working-directory: vitalsync/backend
        run: npm test

  build_push:
    needs: lint_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./vitalsync/backend
          file: ./vitalsync/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./vitalsync/frontend
          file: ./vitalsync/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  staging_deploy_check:
    needs: build_push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for staging
        working-directory: vitalsync
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Deploy (docker compose)
        working-directory: vitalsync
        run: |
          docker compose up -d --build

      - name: Health check backend (/health)
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              echo "Health check OK"
              exit 0
            fi
            sleep 2
          done
          echo "Health check FAILED"
          docker compose -f vitalsync/docker-compose.yml ps
          docker compose -f vitalsync/docker-compose.yml logs --no-color
          exit 1

      - name: Teardown
        if: always()
        working-directory: vitalsync
        run: docker compose down -v

